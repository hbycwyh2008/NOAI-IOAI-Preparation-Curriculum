name: Repair CNN notebook generator

on:
  push:
    branches:
      - agent/workflow-first-competition-sprint
    paths:
      - ".github/workflows/repair-cnn-generator.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workflow-first-competition-sprint
      - name: Replace only the validated N09 CNN block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/generate_ready_notebooks.py")
          text = path.read_text(encoding="utf-8")
          old = """model=nn.Sequential(nn.Conv2d(1,8,3,padding=1),nn.ReLU(),nn.MaxPool2d(2),nn.Conv2d(8,12,3,padding=1),nn.ReLU(),nn.AdaptiveAvgPool2d(1),nn.Flatten(),nn.Linear(12,2)).to(device)
          opt=torch.optim.Adam(model.parameters(),lr=.01); loss_fn=nn.CrossEntropyLoss()
          for _ in range(3):"""
          new = """model=nn.Sequential(nn.Conv2d(1,8,3,padding=1),nn.ReLU(),nn.MaxPool2d(2),nn.Conv2d(8,16,3,padding=1),nn.ReLU(),nn.MaxPool2d(2),nn.Flatten(),nn.Linear(16*5*5,16),nn.ReLU(),nn.Linear(16,2)).to(device)
          opt=torch.optim.Adam(model.parameters(),lr=.01); loss_fn=nn.CrossEntropyLoss()
          for _ in range(5):"""
          if text.count(old) != 1:
              raise RuntimeError(f"Expected exactly one N09 CNN block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit the source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_ready_notebooks.py
          git commit -m 'Make generated CNN notebook reliably learn spatial patterns'
          git push
