name: Validate ready-to-teach curriculum

on:
  push:
    paths:
      - "README.md"
      - "TEACHER_START_HERE.md"
      - "STUDENT_START_HERE.md"
      - "MANIFEST.md"
      - "requirements.txt"
      - "00_Course_Overview/**"
      - "01_Student_Start/**"
      - "02_Class_Missions/**"
      - "03_Templates/**"
      - "04_Assessment/**"
      - "05_Resources/**"
      - "06_Starter_Code/ready_to_teach/**"
      - "06_Starter_Notebooks/ready_to_teach/**"
      - "08_Public_Documents/**"
      - "09_Teacher_Planning/**"
      - "10_Ready_to_Teach_Pack/**"
      - "scripts/generate_ready_notebooks.py"
      - "scripts/generate_ready_notebooks_deterministic.py"
      - "scripts/check_required_links.py"
      - "scripts/validate_curriculum.py"
      - "scripts/validate_curriculum_structure.py"
      - "scripts/validate_readiness_contract.py"
      - "scripts/validate_class_mission_launchers.py"
      - "scripts/validate_repository_hygiene.py"
      - "scripts/normalize_lesson_timelines.py"
      - ".github/workflows/validate-ready-to-teach.yml"
      - ".github/workflows/normalise-lesson-timelines.yml"
  pull_request:
    paths:
      - "README.md"
      - "TEACHER_START_HERE.md"
      - "STUDENT_START_HERE.md"
      - "MANIFEST.md"
      - "requirements.txt"
      - "00_Course_Overview/**"
      - "01_Student_Start/**"
      - "02_Class_Missions/**"
      - "03_Templates/**"
      - "04_Assessment/**"
      - "05_Resources/**"
      - "06_Starter_Code/ready_to_teach/**"
      - "06_Starter_Notebooks/ready_to_teach/**"
      - "08_Public_Documents/**"
      - "09_Teacher_Planning/**"
      - "10_Ready_to_Teach_Pack/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "20 2 1 * *"

concurrency:
  group: validate-ready-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate curriculum structure and internal consistency
        run: python scripts/validate_curriculum_structure.py

      - name: Validate public readiness contract
        run: python scripts/validate_readiness_contract.py

      - name: Validate Class Missions launchers
        run: python scripts/validate_class_mission_launchers.py

      - name: Validate repository hygiene
        run: python scripts/validate_repository_hygiene.py

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate twelve stable starter notebooks
        run: python scripts/generate_ready_notebooks_deterministic.py

      - name: Verify generated notebooks are current
        shell: bash
        run: |
          changes="$(git status --porcelain -- 06_Starter_Notebooks/ready_to_teach)"
          if [ -n "$changes" ]; then
            echo "Generated notebooks do not match the deterministic generation pipeline."
            echo "$changes"
            git diff -- 06_Starter_Notebooks/ready_to_teach
            exit 1
          fi

      - name: Execute notebooks from fresh kernels
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          from datetime import datetime, timezone
          from pathlib import Path
          import platform
          import importlib
          import nbformat
          from nbclient import NotebookClient

          folder = Path('06_Starter_Notebooks/ready_to_teach')
          notebooks = sorted(folder.glob('*.ipynb'))
          if len(notebooks) != 12:
              raise RuntimeError(f'Expected 12 notebooks, found {len(notebooks)}')

          results = []
          for path in notebooks:
              notebook = nbformat.read(path, as_version=4)
              NotebookClient(
                  notebook,
                  timeout=300,
                  kernel_name='python3',
                  allow_errors=False,
              ).execute(cwd=str(folder))
              results.append((path.name, 'PASS'))

          packages = [
              'numpy','pandas','matplotlib','sklearn','torch','torchvision',
              'torchaudio','cv2','librosa','optuna','nbformat','nbclient'
          ]
          versions = []
          for name in packages:
              module = importlib.import_module(name)
              versions.append((name, getattr(module, '__version__', 'unknown')))

          lines = [
              '# Runtime Validation Record', '',
              f'- Validated: {datetime.now(timezone.utc).isoformat()}',
              f'- Commit: {__import__("subprocess").check_output(["git", "rev-parse", "HEAD"], text=True).strip()}',
              f'- Python: {platform.python_version()}',
              f'- Platform: {platform.platform()}',
              '- Runner: GitHub Actions ubuntu-latest',
              '- Network downloads inside notebooks: none',
              '- Device requirement: CPU-safe', '',
              '## Package versions', '',
          ]
          lines += [f'- `{name}=={version}`' for name, version in versions]
          lines += ['', '## Notebook results', '']
          lines += [f'- `{name}`: {status}' for name, status in results]
          lines += ['', 'All twelve notebooks executed from fresh kernels without manual state repair.']
          Path('/tmp/Runtime_Validation_Record.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Smoke-test executable starter code
        run: |
          python 06_Starter_Code/ready_to_teach/metrics_from_counts.py
          python 06_Starter_Code/ready_to_teach/generate_practice_data.py --output /tmp/noai-practice --seed 2026
          python 06_Starter_Code/ready_to_teach/validate_submission.py --help
          python 06_Starter_Code/ready_to_teach/competition_sprint_experiment_log.py init --path /tmp/competition-sprint-log.csv
          python 06_Starter_Code/ready_to_teach/competition_sprint_experiment_log.py add \
            --path /tmp/competition-sprint-log.csv \
            --experiment-id E00 \
            --hypothesis "baseline should run" \
            --single-change "baseline only" \
            --metric-name f1 \
            --metric-value 0.5 \
            --runtime-seconds 1.0 \
            --decision investigate
          python 06_Starter_Code/ready_to_teach/competition_sprint_experiment_log.py summary --path /tmp/competition-sprint-log.csv
          python 06_Starter_Code/ready_to_teach/manual_tuning_template.py --output /tmp/manual-tuning-results.json
          python 06_Starter_Code/ready_to_teach/optuna_tuning_template.py --trials 2 --output /tmp/optuna-tuning-results.json
          python 06_Starter_Code/ready_to_teach/model_ensembling_template.py --output /tmp/model-ensembling-results.json

      - name: Check required external resource links
        run: python scripts/check_required_links.py --output /tmp/Link_Verification_Latest.md

      - name: Upload volatile validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ready-to-teach-validation-${{ github.sha }}
          path: |
            /tmp/Runtime_Validation_Record.md
            /tmp/Link_Verification_Latest.md
          if-no-files-found: warn
          retention-days: 30
