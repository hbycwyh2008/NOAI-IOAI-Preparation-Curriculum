name: Audit curriculum consistency

on:
  push:
    paths:
      - "README.md"
      - "00_Course_Overview/**"
      - "01_Student_Start/**"
      - "02_Class_Missions/**"
      - "03_Templates/**"
      - "04_Assessment/**"
      - "05_Resources/**"
      - "06_Starter_Code/**"
      - "09_Teacher_Planning/**"
      - "10_Ready_to_Teach_Pack/**"
      - "scripts/validate_curriculum_structure.py"
      - "scripts/validate_readiness_contract.py"
      - "scripts/validate_class_mission_launchers.py"
      - ".github/workflows/audit-curriculum.yml"
  pull_request:
    paths:
      - "README.md"
      - "00_Course_Overview/**"
      - "01_Student_Start/**"
      - "02_Class_Missions/**"
      - "03_Templates/**"
      - "04_Assessment/**"
      - "05_Resources/**"
      - "09_Teacher_Planning/**"
      - "10_Ready_to_Teach_Pack/**"
      - "scripts/validate_curriculum_structure.py"
      - "scripts/validate_readiness_contract.py"
      - "scripts/validate_class_mission_launchers.py"
      - ".github/workflows/audit-curriculum.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run strict curriculum, readiness, and launcher audits
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/validate_curriculum_structure.py > /tmp/audit.log 2>&1
          structure_code=$?
          python scripts/validate_readiness_contract.py >> /tmp/audit.log 2>&1
          readiness_code=$?
          python scripts/validate_class_mission_launchers.py >> /tmp/audit.log 2>&1
          launcher_code=$?

          if [ "$structure_code" -ne 0 ] || [ "$readiness_code" -ne 0 ] || [ "$launcher_code" -ne 0 ]; then
            combined_code=1
          else
            combined_code=0
          fi

          echo "exit_code=$combined_code" >> "$GITHUB_OUTPUT"
          cat /tmp/audit.log
          exit 0

      - name: Write auditable result
        shell: bash
        run: |
          {
            echo "# Automated Curriculum Audit"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Runner: GitHub Actions / Python 3.12"
            echo "- Exit code: \`${{ steps.audit.outputs.exit_code }}\`"
            echo
            echo '```text'
            cat /tmp/audit.log
            echo '```'
          } > 10_Ready_to_Teach_Pack/Automated_Curriculum_Audit_Latest.md

      - name: Commit main-branch audit result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 10_Ready_to_Teach_Pack/Automated_Curriculum_Audit_Latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record automated curriculum audit result'
            git push
          fi

      - name: Enforce audit result
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
