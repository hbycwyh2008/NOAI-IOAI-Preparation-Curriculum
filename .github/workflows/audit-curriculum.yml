name: Audit curriculum consistency

on:
  push:
    paths:
      - "README.md"
      - "TEACHER_START_HERE.md"
      - "STUDENT_START_HERE.md"
      - "MANIFEST.md"
      - "curriculum_spec.json"
      - "00_Course_Overview/**"
      - "01_Student_Start/**"
      - "02_Class_Missions/**"
      - "03_Templates/**"
      - "04_Assessment/**"
      - "05_Resources/**"
      - "06_Starter_Code/**"
      - "08_Public_Documents/**"
      - "09_Teacher_Planning/**"
      - "10_Ready_to_Teach_Pack/**"
      - "scripts/validate_curriculum_structure.py"
      - "scripts/validate_curriculum_spec.py"
      - "scripts/validate_readiness_contract.py"
      - "scripts/validate_class_mission_launchers.py"
      - "scripts/validate_repository_hygiene.py"
      - "scripts/plan_learning_path.py"
      - "scripts/generate_daily_model_drill.py"
      - ".github/workflows/audit-curriculum.yml"
  pull_request:
    paths:
      - "README.md"
      - "TEACHER_START_HERE.md"
      - "STUDENT_START_HERE.md"
      - "MANIFEST.md"
      - "curriculum_spec.json"
      - "00_Course_Overview/**"
      - "01_Student_Start/**"
      - "02_Class_Missions/**"
      - "03_Templates/**"
      - "04_Assessment/**"
      - "05_Resources/**"
      - "06_Starter_Code/**"
      - "08_Public_Documents/**"
      - "09_Teacher_Planning/**"
      - "10_Ready_to_Teach_Pack/**"
      - "scripts/validate_curriculum_structure.py"
      - "scripts/validate_curriculum_spec.py"
      - "scripts/validate_readiness_contract.py"
      - "scripts/validate_class_mission_launchers.py"
      - "scripts/validate_repository_hygiene.py"
      - "scripts/plan_learning_path.py"
      - "scripts/generate_daily_model_drill.py"
      - ".github/workflows/audit-curriculum.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run structure, specification, tools, readiness, launcher, and hygiene audits
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/validate_curriculum_structure.py > /tmp/audit.log 2>&1
          structure_code=$?
          python scripts/validate_curriculum_spec.py >> /tmp/audit.log 2>&1
          spec_code=$?
          python scripts/plan_learning_path.py --self-test >> /tmp/audit.log 2>&1
          planner_code=$?
          python scripts/generate_daily_model_drill.py --self-test >> /tmp/audit.log 2>&1
          drill_code=$?
          python scripts/validate_readiness_contract.py >> /tmp/audit.log 2>&1
          readiness_code=$?
          python scripts/validate_class_mission_launchers.py >> /tmp/audit.log 2>&1
          launcher_code=$?
          python scripts/validate_repository_hygiene.py >> /tmp/audit.log 2>&1
          hygiene_code=$?

          if [ "$structure_code" -ne 0 ] || [ "$spec_code" -ne 0 ] || [ "$planner_code" -ne 0 ] || [ "$drill_code" -ne 0 ] || [ "$readiness_code" -ne 0 ] || [ "$launcher_code" -ne 0 ] || [ "$hygiene_code" -ne 0 ]; then
            combined_code=1
          else
            combined_code=0
          fi

          echo "exit_code=$combined_code" >> "$GITHUB_OUTPUT"
          cat /tmp/audit.log
          exit 0

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Curriculum audit"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Runner: GitHub Actions / Python 3.12"
            echo "- Exit code: \`${{ steps.audit.outputs.exit_code }}\`"
            echo
            echo '```text'
            cat /tmp/audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curriculum-audit-${{ github.sha }}
          path: /tmp/audit.log
          retention-days: 30

      - name: Enforce audit result
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
