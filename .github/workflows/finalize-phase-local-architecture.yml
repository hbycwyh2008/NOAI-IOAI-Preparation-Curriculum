name: Finalize Phase-Local Architecture

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/close-public-readiness-gaps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-public-readiness-gaps
          fetch-depth: 0

      - name: Finalize validators and architecture documents
        run: python scripts/finalize_phase_local_architecture.py

      - name: Commit final architecture and remove one-time machinery
        run: |
          git rm -f scripts/finalize_phase_local_architecture.py
          git rm -f .github/workflows/finalize-phase-local-architecture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize phase-local canonical lesson architecture"
          git push origin HEAD:agent/close-public-readiness-gaps
