name: Delete merged cleanup branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-merged-cleanup-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" agent/repository-cleanup-audit >/dev/null 2>&1 || exit 0
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete agent/repository-cleanup-audit
