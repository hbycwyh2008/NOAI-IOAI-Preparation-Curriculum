name: Delete merged cleanup branch

on:
  push:
    branches:
      - main
    paths:
      - .github/branch-delete-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/repository-cleanup-audit" || true
