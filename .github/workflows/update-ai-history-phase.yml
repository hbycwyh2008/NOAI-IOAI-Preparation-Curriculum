name: Update AI History Phase

on:
  push:
    branches:
      - agent/rebuild-class-missions-pathway
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.event_name == 'push' || github.head_ref == 'agent/rebuild-class-missions-pathway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-class-missions-pathway
          fetch-depth: 0

      - name: Apply curriculum update
        run: python scripts/update_ai_history_phase.py

      - name: Commit curriculum update
        run: |
          git rm -f scripts/update_ai_history_phase.py
          git rm -f .github/workflows/update-ai-history-phase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Kaggle phase with AI history reading sequence"
          git push origin HEAD:agent/rebuild-class-missions-pathway
