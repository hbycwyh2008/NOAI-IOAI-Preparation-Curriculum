name: Finalize AI History Phase

on:
  push:
    branches:
      - agent/rebuild-class-missions-pathway
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'push' || github.head_ref == 'agent/rebuild-class-missions-pathway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-class-missions-pathway
          fetch-depth: 0

      - name: Finalize curriculum structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')

          def replace(path, pairs):
              path = Path(path)
              if not path.exists():
                  return
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          old_phase = root / '02_Class_Missions/04_Kaggle_ML_Refresh'
          if old_phase.exists():
              shutil.rmtree(old_phase)

          temp_script = root / 'scripts/update_ai_history_phase.py'
          if temp_script.exists():
              temp_script.unlink()

          validator = root / 'scripts/validate_curriculum_structure.py'
          text = validator.read_text(encoding='utf-8')
          old_required = '    "02_Class_Missions/04_Kaggle_ML_Refresh/README.md",'
          new_required = '''    "02_Class_Missions/04_AI_History_and_Thinking_Humans/README.md",
              "02_Class_Missions/04_AI_History_and_Thinking_Humans/lesson-01-what-counts-as-intelligence.md",
              "02_Class_Missions/04_AI_History_and_Thinking_Humans/lesson-02-neural-networks-and-ai-cycles.md",
              "02_Class_Missions/04_AI_History_and_Thinking_Humans/lesson-03-how-machines-recognise-images.md",
              "02_Class_Missions/04_AI_History_and_Thinking_Humans/lesson-04-what-did-the-model-learn.md",
              "02_Class_Missions/04_AI_History_and_Thinking_Humans/lesson-05-reward-games-and-reinforcement-learning.md",
              "02_Class_Missions/04_AI_History_and_Thinking_Humans/lesson-06-language-processing-and-understanding.md",
              "02_Class_Missions/04_AI_History_and_Thinking_Humans/lesson-07-common-sense-abstraction-and-analogy.md",
              "02_Class_Missions/04_AI_History_and_Thinking_Humans/lesson-08-how-intelligent-is-ai.md",'''
          text = text.replace(old_required, new_required)
          text = text.replace('("75 sessions", "155 lessons", "Competition sprint")', '("78 sessions", "155 lessons", "Competition sprint")')
          text = text.replace('("75 sessions", "155 lessons", "70-Minute Bohrium Exception")', '("78 sessions", "155 lessons", "70-Minute Bohrium Exception")')
          text = text.replace('("75 scheduled sessions", "Phase 8 — Tuning, Ensembling, and Competition")', '("78 scheduled sessions", "Phase 8 — Tuning, Ensembling, and Competition")')
          text = text.replace('("Phase", "72–75", "155 mainline lesson files", "16 Bohrium resource lessons")', '("Phase", "75–78", "155 mainline lesson files", "16 Bohrium resource lessons")')
          text = text.replace('("CS50P", "Bohrium", "Andrew Ng Machine Learning", "Andrew Ng Deep Learning", "Model Comparison")', '("CS50P", "Bohrium", "AI History", "Andrew Ng Machine Learning", "Andrew Ng Deep Learning", "Model Comparison")')
          validator.write_text(text, encoding='utf-8')

          replace('02_Class_Missions/05_Andrew_Ng_ML_Model_Labs/README.md', [
              ('**Scheduled sessions:** 38–55', '**Scheduled sessions:** 41–58'),
          ])
          path = Path('02_Class_Missions/05_Andrew_Ng_ML_Model_Labs/README.md')
          text = path.read_text(encoding='utf-8')
          if '## Embedded Kaggle Practice' not in text:
              text += '''\n\n## Embedded Kaggle Practice\n\nKaggle Learn is used inside the model labs rather than as a separate scheduled phase. Selected exercises provide short practical rehearsals of Pandas, train/validation splits, decision-tree baselines, missing-value handling, categorical encoding, pipelines, cross-validation, and leakage prevention. Every Kaggle activity must serve the model currently being learned and produce baseline, validation, and error-analysis evidence.\n\nSee [Kaggle Learn Embedded Practice Map](../../05_Resources/Kaggle_Learn_Refresh_Map.md).\n'''
              path.write_text(text, encoding='utf-8')

          replace('02_Class_Missions/06_Andrew_Ng_DL_PyTorch/README.md', [('**Scheduled sessions:** 56–67', '**Scheduled sessions:** 59–70')])
          replace('02_Class_Missions/07_Model_Comparison_EDA_Evaluation/README.md', [('**Scheduled sessions:** 68–71', '**Scheduled sessions:** 71–74')])
          replace('02_Class_Missions/08_Tuning_Ensembling_Competition/README.md', [('**Scheduled sessions:** 72–75', '**Scheduled sessions:** 75–78')])

          overview_files = [
              '00_Course_Overview/README.md',
              '00_Course_Overview/Cohort_Pathways_and_Required_Optional_Map.md',
              '09_Teacher_Planning/README.md',
              '10_Ready_to_Teach_Pack/README.md',
              '10_Ready_to_Teach_Pack/Curriculum_Readiness_Audit.md',
              'MANIFEST.md',
          ]
          pairs = [
              ('75 scheduled sessions', '78 scheduled sessions'),
              ('75 sessions', '78 sessions'),
              ('75-session', '78-session'),
              ('Sessions 33–37', 'Sessions 33–40'),
              ('Sessions 38–55', 'Sessions 41–58'),
              ('Sessions 56–67', 'Sessions 59–70'),
              ('Sessions 68–71', 'Sessions 71–74'),
              ('Sessions 72–75', 'Sessions 75–78'),
              ('33–37', '33–40'),
              ('38–55', '41–58'),
              ('56–67', '59–70'),
              ('68–71', '71–74'),
              ('72–75', '75–78'),
              ('04_Kaggle_ML_Refresh', '04_AI_History_and_Thinking_Humans'),
              ('Kaggle ML refresh', 'AI History and Thinking Humans'),
              ('Kaggle workflow refresh', 'AI history and critical-reading phase'),
              ('selected Kaggle Learn workflow refresh', 'eight-session AI history and critical-reading sequence'),
              ('Kaggle machine-learning workflow refresh', 'AI history and critical reading through Melanie Mitchell'),
          ]
          for file in overview_files:
              replace(file, pairs)

          resource = Path('05_Resources/Kaggle_Learn_Refresh_Map.md')
          if resource.exists():
              text = resource.read_text(encoding='utf-8')
              text = text.replace('# Kaggle Learn Refresh Map', '# Kaggle Learn Embedded Practice Map')
              marker = 'Kaggle Learn is not a separate scheduled phase.'
              if marker not in text:
                  lines = text.splitlines()
                  lines.insert(1, '')
                  lines.insert(2, marker + ' Selected material is embedded in Andrew Ng Machine Learning model labs when workflow rehearsal is needed.')
                  text = '\n'.join(lines) + '\n'
              resource.write_text(text, encoding='utf-8')

          workflow = root / '.github/workflows/update-ai-history-phase.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit final curriculum update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize eight-session AI history phase"
          git push origin HEAD:agent/rebuild-class-missions-pathway
