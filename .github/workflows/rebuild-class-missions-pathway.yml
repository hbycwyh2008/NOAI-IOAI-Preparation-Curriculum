name: Rebuild Class Missions Pathway

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-class-missions-pathway
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-class-missions-pathway
          fetch-depth: 0

      - name: Reorganise Class Missions
        run: python scripts/restructure_class_missions.py

      - name: Commit migration
        run: |
          git rm -f scripts/restructure_class_missions.py
          git rm -f .github/workflows/rebuild-class-missions-pathway.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Class Missions around the learning pathway"
          git push origin HEAD:agent/rebuild-class-missions-pathway
