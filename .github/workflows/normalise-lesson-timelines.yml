name: Validate curriculum structure

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '00_Course_Overview/**'
      - '02_Class_Missions/**'
      - '10_Ready_to_Teach_Pack/**'
      - 'scripts/normalize_lesson_timelines.py'
      - 'scripts/validate_curriculum.py'
      - 'scripts/validate_curriculum_structure.py'
      - '.github/workflows/normalise-lesson-timelines.yml'
  pull_request:
    paths:
      - 'README.md'
      - '00_Course_Overview/**'
      - '02_Class_Missions/**'
      - '10_Ready_to_Teach_Pack/**'
      - 'scripts/normalize_lesson_timelines.py'
      - 'scripts/validate_curriculum.py'
      - 'scripts/validate_curriculum_structure.py'
      - '.github/workflows/normalise-lesson-timelines.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate module counts, lesson links, classroom flow, and overview consistency
        run: python scripts/validate_curriculum_structure.py

      - name: Confirm legacy entry points are non-destructive
        run: |
          python scripts/validate_curriculum.py
          python scripts/normalize_lesson_timelines.py
