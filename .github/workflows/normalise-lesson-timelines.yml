name: Validate curriculum structure

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'TEACHER_START_HERE.md'
      - 'STUDENT_START_HERE.md'
      - 'MANIFEST.md'
      - 'curriculum_spec.json'
      - '00_Course_Overview/**'
      - '01_Student_Start/**'
      - '02_Class_Missions/**'
      - '03_Templates/**'
      - '04_Assessment/**'
      - '05_Resources/**'
      - '08_Public_Documents/**'
      - '09_Teacher_Planning/**'
      - '10_Ready_to_Teach_Pack/**'
      - 'scripts/normalize_lesson_timelines.py'
      - 'scripts/validate_curriculum.py'
      - 'scripts/validate_curriculum_structure.py'
      - 'scripts/validate_curriculum_spec.py'
      - 'scripts/plan_learning_path.py'
      - 'scripts/generate_daily_model_drill.py'
      - '.github/workflows/normalise-lesson-timelines.yml'
      - '.github/workflows/validate-ready-to-teach.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'TEACHER_START_HERE.md'
      - 'STUDENT_START_HERE.md'
      - 'MANIFEST.md'
      - 'curriculum_spec.json'
      - '00_Course_Overview/**'
      - '01_Student_Start/**'
      - '02_Class_Missions/**'
      - '03_Templates/**'
      - '04_Assessment/**'
      - '05_Resources/**'
      - '08_Public_Documents/**'
      - '09_Teacher_Planning/**'
      - '10_Ready_to_Teach_Pack/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate module counts, lesson links, lesson flow, resource delivery, and overview consistency
        run: python scripts/validate_curriculum_structure.py

      - name: Validate machine-readable specification and execution layer
        run: python scripts/validate_curriculum_spec.py

      - name: Self-test pathway planning and daily drill generation
        run: |
          python scripts/plan_learning_path.py --self-test
          python scripts/generate_daily_model_drill.py --self-test

      - name: Confirm legacy entry points are non-destructive
        run: |
          python scripts/validate_curriculum.py
          python scripts/normalize_lesson_timelines.py
